<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まちかどジグソー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #dce8fb;
  --bg2: #c3d5f4;
  --panel: #ffffff;
  --line: #aebfe3;
  --text: #16204a;
  --muted: #55639a;
  --accent: #f2a900;
  --accent-ink: #2a1d00;
  --ok: #1a9e90;
  --shadow: rgba(22, 32, 74, .38);
  --star: rgba(255, 255, 255, 0);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131b37;
    --bg2: #0a1026;
    --panel: #1c2750;
    --line: #34416f;
    --text: #eef1fb;
    --muted: #a3aed6;
    --accent: #ffd35a;
    --accent-ink: #2a1d00;
    --ok: #62d6c6;
    --shadow: rgba(0, 0, 0, .6);
    --star: rgba(255, 255, 255, .75);
  }
}
:root[data-theme="dark"] {
  --bg: #131b37;
  --bg2: #0a1026;
  --panel: #1c2750;
  --line: #34416f;
  --text: #eef1fb;
  --muted: #a3aed6;
  --accent: #ffd35a;
  --accent-ink: #2a1d00;
  --ok: #62d6c6;
  --shadow: rgba(0, 0, 0, .6);
  --star: rgba(255, 255, 255, .75);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100%;
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  font-weight: 500;
  color: var(--text);
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.6px 1.6px at 8% 14%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 22% 66%, var(--star), transparent),
    radial-gradient(1.8px 1.8px at 35% 28%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 51% 82%, var(--star), transparent),
    radial-gradient(1.6px 1.6px at 63% 12%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 77% 58%, var(--star), transparent),
    radial-gradient(1.8px 1.8px at 90% 30%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 94% 88%, var(--star), transparent),
    radial-gradient(1.4px 1.4px at 14% 92%, var(--star), transparent);
}
.app {
  position: relative;
  max-width: 980px;
  margin: 0 auto;
  padding: 12px 14px 28px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 {
  margin: 0;
  font-weight: 900;
  font-size: clamp(1.15rem, 3.6vw, 1.6rem);
  line-height: 1.2;
  letter-spacing: .02em;
}
.brand p { margin: 2px 0 0; font-size: .78rem; color: var(--muted); }
.mascot { flex: none; display: block; }
.mascot.sm { width: 46px; height: 46px; }
.mascot.lg { width: 92px; height: 92px; }
.mascot.xl { width: 112px; height: 112px; }
.mc-ring { fill: none; stroke: var(--ok); stroke-width: 7; stroke-linecap: round; }
.mc-body { fill: var(--accent); }
.mc-eye { fill: #2a1d00; }
.mc-mouth { fill: none; stroke: #2a1d00; stroke-width: 3.2; stroke-linecap: round; }
.mc-cheek { fill: #ff8f8f; opacity: .65; }
.hud { display: flex; gap: 14px; flex: none; }
.stat { text-align: right; line-height: 1.2; }
.stat .k { display: block; font-size: .7rem; color: var(--muted); }
.stat .v { font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.btn {
  font: inherit;
  font-weight: 700;
  font-size: .9rem;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: .5em 1.1em;
  min-height: 44px;
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn:focus-visible, .lvl:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stage { width: 100%; }
.field {
  position: relative;
  margin: 0 auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  transition: height .6s ease;
}
.board {
  position: absolute;
  left: 0; top: 0;
  background: color-mix(in srgb, var(--text) 7%, transparent);
  box-shadow: 0 0 0 2px var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.board .ghost { display: block; width: 100%; height: 100%; opacity: .13; pointer-events: none; }
.board.noguide .ghost { opacity: 0; }
.tray-hint {
  position: absolute;
  left: 0; right: 0;
  text-align: center;
  font-size: .78rem;
  color: var(--muted);
  pointer-events: none;
}
.piece {
  position: absolute;
  pointer-events: none;
  filter: drop-shadow(0 2px 3px var(--shadow));
  transition: transform .16s ease;
}
.piece.lift { filter: drop-shadow(0 10px 12px var(--shadow)); }
.piece.locked { filter: none; }
.piece.snap { animation: snap .55s ease-out; }
@keyframes snap {
  0% { filter: brightness(1.6) drop-shadow(0 0 8px var(--accent)); }
  100% { filter: brightness(1); }
}
.final {
  position: absolute;
  left: 0; top: 0;
  width: 100%;
  overflow: hidden;
  opacity: 0;
  z-index: 5;
  pointer-events: none;
  transition: opacity .7s ease;
}
.final img { display: block; width: 100%; height: 100%; }
.final.show { opacity: 1; }
.final::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .6) 50%, transparent 62%);
  transform: translateX(-110%);
}
.final.show::after { animation: sweep 1.1s .55s ease-out 1 forwards; }
@keyframes sweep { to { transform: translateX(110%); } }
.preview {
  position: absolute;
  left: 0; top: 0;
  overflow: hidden;
  opacity: 0;
  z-index: 6000;
  pointer-events: none;
  transition: opacity .25s ease;
  box-shadow: 0 0 0 3px var(--accent);
}
.preview img { display: block; width: 100%; height: 100%; }
.preview.show { opacity: 1; }

.result {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 20px;
  margin: 18px auto 0;
  max-width: 760px;
}
.result[hidden] { display: none; }
.bubble {
  position: relative;
  flex: 1 1 260px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 18px;
}
.bubble::before {
  content: "";
  position: absolute;
  left: -9px; top: 34px;
  width: 16px; height: 16px;
  background: var(--panel);
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transform: rotate(45deg);
}
.bubble h2 { margin: 0 0 4px; font-size: 1.25rem; font-weight: 900; }
.bubble .era {
  display: inline-block;
  margin-right: 8px;
  padding: 1px 10px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 700;
  background: var(--ok);
  color: #06201c;
  vertical-align: middle;
}
.bubble p { margin: 6px 0 0; line-height: 1.7; }
.bubble .rstat { color: var(--muted); font-size: .88rem; }
.ractions { display: flex; flex-wrap: wrap; gap: 8px; flex-basis: 100%; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 9000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: color-mix(in srgb, var(--bg2) 82%, transparent);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  overflow-y: auto;
}
.overlay[hidden] { display: none; }
.intro-card {
  width: min(560px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px 22px 18px;
}
.intro-head { display: flex; align-items: center; gap: 14px; }
.intro-head h2 { margin: 0; font-size: 1.5rem; font-weight: 900; line-height: 1.25; }
.intro-card .lead { margin: 14px 0 4px; line-height: 1.75; }
.intro-card .how { margin: 0 0 14px; font-size: .86rem; color: var(--muted); line-height: 1.6; }
.lvls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lvl {
  font: inherit;
  color: var(--text);
  background: color-mix(in srgb, var(--accent) 16%, var(--panel));
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 12px 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.lvl b { font-size: 1.05rem; font-weight: 900; }
.lvl span { font-size: .85rem; }
.lvl small { font-size: .72rem; color: var(--muted); }
.lvl:hover small { color: var(--accent-ink); }
.lvl em { font-style: normal; font-size: .72rem; color: var(--muted); min-height: 1.1em; }
.lvl:hover { background: var(--accent); color: var(--accent-ink); }
.lvl:hover em { color: var(--accent-ink); }
.resume { margin-top: 12px; text-align: center; }
.resume[hidden] { display: none; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px);
  max-width: 90vw;
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: .9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 9500;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
@media (max-width: 480px) {
  .lvls { grid-template-columns: 1fr; }
  .lvl { display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; padding: 12px 18px; row-gap: 2px; }
  .lvl b { grid-column: 1; grid-row: 1; }
  .lvl span { grid-column: 2; grid-row: 1; }
  .lvl small { grid-column: 1; grid-row: 2; }
  .lvl em { grid-column: 2; grid-row: 2; text-align: right; }
  .brand p { display: none; }
  .bubble::before { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .field, .final, .preview, .toast, .piece { transition: none; }
  .piece.snap, .final.show::after { animation: none; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- ぷらねっと君（仮イラスト）。本物のマスコット画像に差し替えてください -->
    <symbol id="mascot" viewBox="0 0 120 120">
      <ellipse class="mc-ring" cx="60" cy="66" rx="52" ry="15" transform="rotate(-16 60 66)"/>
      <circle class="mc-body" cx="60" cy="60" r="35"/>
      <circle class="mc-eye" cx="48" cy="56" r="4.6"/>
      <circle class="mc-eye" cx="72" cy="56" r="4.6"/>
      <ellipse class="mc-cheek" cx="41" cy="68" rx="6" ry="4"/>
      <ellipse class="mc-cheek" cx="79" cy="68" rx="6" ry="4"/>
      <path class="mc-mouth" d="M52 68 Q60 77 68 68"/>
      <path class="mc-ring" d="M9 66 A52 15 0 0 0 111 66" transform="rotate(-16 60 66)" style="stroke-width:7"/>
    </symbol>
  </defs>
</svg>

<main class="app">
  <header class="top">
    <div class="brand">
      <svg class="mascot sm" aria-hidden="true"><use href="#mascot"/></svg>
      <div>
        <h1>まちかどジグソー</h1>
        <p>ぷらねっと君と、まちの写真を組み立てよう</p>
      </div>
    </div>
    <div class="hud" aria-live="off">
      <div class="stat"><span class="k">時間</span><span class="v" id="time">0:00</span></div>
      <div class="stat"><span class="k">はまった数</span><span class="v" id="prog">0/0</span></div>
    </div>
  </header>

  <div class="bar">
    <button class="btn" id="btnPreview" type="button" aria-pressed="false">見本を見る</button>
    <button class="btn" id="btnRestart" type="button">ピースを混ぜ直す</button>
    <button class="btn" id="btnLevel" type="button">ピース数を変える</button>
  </div>

  <div class="stage">
    <section class="field" id="field" aria-label="ジグソーパズルの盤面">
      <div class="board" id="board"><img class="ghost" id="ghost" alt=""></div>
      <div class="final" id="final"><img id="finalImg" alt="完成した写真"></div>
      <div class="preview" id="preview"><img id="previewImg" alt="完成見本"></div>
      <div class="tray-hint" id="trayHint">ピースをドラッグして、上の枠にはめよう</div>
    </section>
  </div>

  <section class="result" id="result" hidden>
    <svg class="mascot lg" aria-hidden="true"><use href="#mascot"/></svg>
    <div class="bubble">
      <h2><span class="era" id="rEra"></span><span id="rTitle"></span></h2>
      <p id="rComment"></p>
      <p class="rstat" id="rStat"></p>
    </div>
    <div class="ractions">
      <button class="btn primary" id="btnShare" type="button">結果をシェア</button>
      <button class="btn" id="btnAgain" type="button">もう一度あそぶ</button>
      <button class="btn" id="btnLevel2" type="button">ピース数を変える</button>
    </div>
  </section>
</main>

<div class="overlay" id="intro">
  <div class="intro-card" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="intro-head">
      <svg class="mascot xl" aria-hidden="true"><use href="#mascot"/></svg>
      <h2 id="introTitle">まちかどジグソー</h2>
    </div>
    <p class="lead">こんにちは、ぷらねっと君だよ！ まちの写真のピースを集めて、元の姿に組み立ててね。</p>
    <p class="how">ピースをドラッグして、正しい場所に近づけるとカチッとはまります。回転ありのレベルでは、ピースをタップすると向きが変わります。</p>
    <div class="lvls" id="lvlList"></div>
    <div class="resume" id="resume" hidden>
      <button class="btn" id="btnResume" type="button">いまのパズルに戻る</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const rnd = (m) => (Math.random() * 2 - 1) * m;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const bestKey = (lv) => `machikado-jigsaw:${stage.id}:${lv.id}`;

/* ---------- 寸法 ---------- */
function calcMetrics(cols, rows) {
  const availW = Math.min(document.querySelector('.stage').clientWidth, 920);
  const hMax = Math.max(170, (window.innerHeight - 215) / (1 + TRAY));
  let bw = Math.min(availW, hMax * aspect);
  bw = Math.max(bw, Math.min(260, availW));
  const bh = bw / aspect;
  const pw = bw / cols, ph = bh / rows;
  const tray = Math.min(1.5, Math.max(TRAY, (window.innerHeight - 215 - bh) / bh));
  M = {
    cols, rows, bw, bh, pw, ph, tray,
    m: Math.ceil(0.3 * Math.max(pw, ph)),
    dpr: Math.min(window.devicePixelRatio || 1, 2.5)
  };
}
function fieldHeight() { return (S && S.done) ? M.bh : M.bh * (1 + M.tray); }
function applySizes() {
  el.field.style.width = M.bw + 'px';
  el.field.style.height = fieldHeight() + 'px';
  for (const node of [el.board, el.final, el.preview]) {
    node.style.width = M.bw + 'px';
    node.style.height = M.bh + 'px';
  }
  el.hint.style.top = (M.bh + 8) + 'px';
}

/* ---------- ジグソーの形 ---------- */
function newEdge() {
  return { s: Math.random() < 0.5 ? 1 : -1, a: rnd(.04), b: rnd(.04), c: rnd(.04), d: rnd(.04), e: rnd(.04) };
}
function makeEdges(cols, rows) {
  const H = [], V = [];
  for (let y = 0; y <= rows; y++) {
    H[y] = [];
    for (let x = 0; x < cols; x++) H[y][x] = (y === 0 || y === rows) ? null : newEdge();
  }
  for (let y = 0; y < rows; y++) {
    V[y] = [];
    for (let x = 0; x <= cols; x++) V[y][x] = (x === 0 || x === cols) ? null : newEdge();
  }
  return { H, V };
}
function edgePts(e, ax, ay, bx, by, nx, ny, L) {
  const t = 0.1;
  const P = (u, v) => [ax + (bx - ax) * u + nx * v * L * e.s, ay + (by - ay) * u + ny * v * L * e.s];
  return [
    P(0, 0), P(0.2, e.a), P(0.5 + e.b + e.d, -t + e.c), P(0.5 - t + e.b, t + e.c),
    P(0.5 - 2 * t + e.b - e.d, 3 * t + e.c), P(0.5 + 2 * t + e.b - e.d, 3 * t + e.c), P(0.5 + t + e.b, t + e.c),
    P(0.5 + e.b + e.d, -t + e.c), P(0.8, e.e), P(1, 0)
  ];
}
function bez(p, q, rev) {
  if (!rev) {
    p.bezierCurveTo(...q[1], ...q[2], ...q[3]);
    p.bezierCurveTo(...q[4], ...q[5], ...q[6]);
    p.bezierCurveTo(...q[7], ...q[8], ...q[9]);
  } else {
    p.bezierCurveTo(...q[8], ...q[7], ...q[6]);
    p.bezierCurveTo(...q[5], ...q[4], ...q[3]);
    p.bezierCurveTo(...q[2], ...q[1], ...q[0]);
  }
}
function piecePath(pc) {
  const { pw, ph, m } = M, { x, y } = pc, E = S.edges;
  const x0 = m, y0 = m, x1 = m + pw, y1 = m + ph;
  const p = new Path2D();
  p.moveTo(x0, y0);
  let e = E.H[y][x];
  if (e) bez(p, edgePts(e, x0, y0, x1, y0, 0, 1, pw), false); else p.lineTo(x1, y0);
  e = E.V[y][x + 1];
  if (e) bez(p, edgePts(e, x1, y0, x1, y1, 1, 0, ph), false); else p.lineTo(x1, y1);
  e = E.H[y + 1][x];
  if (e) bez(p, edgePts(e, x0, y1, x1, y1, 0, 1, pw), true); else p.lineTo(x0, y1);
  e = E.V[y][x];
  if (e) bez(p, edgePts(e, x0, y0, x0, y1, 1, 0, ph), true); else p.lineTo(x0, y0);
  p.closePath();
  return p;
}
function drawPiece(pc) {
  const { pw, ph, m, dpr, bw, bh } = M;
  const cw = Math.ceil(pw + 2 * m), ch = Math.ceil(ph + 2 * m);
  const c = document.createElement('canvas');
  c.width = Math.round(cw * dpr);
  c.height = Math.round(ch * dpr);
  c.style.width = cw + 'px';
  c.style.height = ch + 'px';
  c.className = 'piece';
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  pc.path = piecePath(pc);
  g.save();
  g.clip(pc.path);
  g.drawImage(img, m - pc.x * pw, m - pc.y * ph, bw, bh);
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(255,255,255,.35)';
  g.lineWidth = 3;
  g.stroke(pc.path);
  g.restore();
  g.lineJoin = 'round';
  g.lineWidth = 1.25;
  g.strokeStyle = 'rgba(0,0,0,.5)';
  g.stroke(pc.path);
  pc.el = c;
  return c;
}

/* ---------- ピースの配置 ---------- */
function place(pc) {
  const { m, pw, ph, bw } = M;
  if (pc.locked) { pc.cx = pc.x * pw - m; pc.cy = pc.y * ph - m; }
  else { pc.cx = pc.fx * bw - m; pc.cy = pc.fy * bw - m; }
  pc.el.style.left = pc.cx + 'px';
  pc.el.style.top = pc.cy + 'px';
}
function mountPieces() {
  for (const pc of S.pieces) {
    drawPiece(pc);
    pc.el.style.zIndex = pc.locked ? 1 : pc.z;
    if (pc.locked) pc.el.classList.add('locked');
    pc.el.style.transform = pc.turn ? `rotate(${pc.turn * 90}deg)` : '';
    place(pc);
    el.field.appendChild(pc.el);
  }
}
function clearPieces() {
  if (!S) return;
  for (const pc of S.pieces) if (pc.el) pc.el.remove();
}
function scatter() {
  const { bw, bh, pw, ph } = M;
  const top = bh * 1.04, trayH = bh * M.tray - bh * 0.04;
  const n = S.n;
  const tcols = Math.max(1, Math.ceil(Math.sqrt(n * (bw / trayH))));
  const trows = Math.ceil(n / tcols);
  const spanX = Math.max(0, bw - pw), spanY = Math.max(0, trayH - ph);
  const order = shuffle([...Array(n).keys()]);
  S.pieces.forEach((pc, i) => {
    const slot = order[i];
    const c = slot % tcols, r = Math.floor(slot / tcols);
    const jx = (spanX / tcols) * 0.35, jy = (spanY / Math.max(trows, 1)) * 0.35;
    const cxm = (c + 0.5) * (spanX / tcols) + rnd(jx);
    const cym = (r + 0.5) * (spanY / trows) + rnd(jy);
    const left = Math.min(Math.max(cxm, 0), spanX);
    const topY = top + Math.min(Math.max(cym, 0), spanY);
    pc.fx = left / bw;
    pc.fy = topY / bw;
    pc.z = zTop++;
  });
}

/* ---------- 時間 ---------- */
const now = () => performance.now();
function elapsed() { return S ? S.elapsed + (S.running ? now() - S.tick : 0) : 0; }
function renderTime() { el.time.textContent = fmt(Math.floor(elapsed() / 1000)); }
function startTimer() {
  if (!S || S.running || S.done) return;
  S.started = true; S.running = true; S.tick = now();
  if (!timerId) timerId = setInterval(renderTime, 250);
}
function pauseTimer() {
  if (!S || !S.running) return;
  S.elapsed = elapsed(); S.running = false;
}
function renderProg() { el.prog.textContent = S ? `${S.locked}/${S.n}` : '0/0'; }

/* ---------- ゲーム進行 ---------- */
function newGame(level) {
  clearPieces();
  el.result.hidden = true;
  el.final.classList.remove('show');
  el.preview.classList.remove('show');
  el.hint.style.display = '';
  el.hint.textContent = level.rotate ? 'ピースをドラッグして上の枠へ。タップで向きが変わるよ' : 'ピースをドラッグして、上の枠にはめよう';
  el.board.classList.toggle('noguide', !level.guide);
  clearInterval(timerId); timerId = null;
  const { cols, rows } = level;
  S = {
    level, cols, rows, n: cols * rows, pieces: [], locked: 0,
    started: false, running: false, elapsed: 0, tick: 0, done: false,
    edges: makeEdges(cols, rows)
  };
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) S.pieces.push({ x, y, locked: false, turn: level.rotate ? Math.floor(Math.random() * 4) : 0 });
  calcMetrics(cols, rows);
  applySizes();
  scatter();
  mountPieces();
  renderTime(); renderProg();
}
function relayout() {
  const cols = S ? S.cols : 6, rows = S ? S.rows : 3;
  const old = M;
  calcMetrics(cols, rows);
  if (old && Math.abs(old.bw - M.bw) < 1 && Math.abs(old.bh - M.bh) < 1) return;
  applySizes();
  if (S) {
    for (const pc of S.pieces) if (pc.el) pc.el.remove();
    if (!S.done) mountPieces();
  }
}
function complete() {
  pauseTimer();
  S.done = true;
  clearInterval(timerId); timerId = null;
  const secs = Math.round(S.elapsed / 1000);
  S.finalSec = secs;
  renderTime();
  let note = '';
  const prev = getBest(S.level);
  if (prev === null || secs < prev) { setBest(S.level, secs); note = prev === null ? '' : '　ベスト更新！'; }
  el.hint.style.display = 'none';
  el.field.style.height = M.bh + 'px';
  el.final.classList.add('show');
  setTimeout(() => { if (S && S.done) S.pieces.forEach((p) => { p.el.style.visibility = 'hidden'; }); }, 800);
  $('#rEra').textContent = stage.era;
  $('#rTitle').textContent = stage.title;
  $('#rComment').textContent = `できた！ ${stage.comment}`;
  $('#rStat').textContent = `${S.n}ピース ／ ${fmt(secs)}${note}`;
  el.result.hidden = false;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => el.result.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }), 700);
}
function lock(pc) {
  pc.locked = true;
  pc.fx = (pc.x * M.pw) / M.bw;
  pc.fy = (pc.y * M.ph) / M.bw;
  place(pc);
  pc.turn = 0;
  pc.el.style.transition = 'none';
  pc.el.style.transform = '';
  pc.el.classList.remove('lift');
  pc.el.classList.add('locked', 'snap');
  pc.el.style.zIndex = 1;
  setTimeout(() => pc.el.classList.remove('snap'), 600);
  S.locked++;
  renderProg();
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* 非対応端末は無視 */ } }
  if (S.locked === S.n) complete();
}

/* ---------- ドラッグ操作 ---------- */
const rotOf = (pc) => (((pc.turn || 0) % 4) + 4) % 4;
function hit(px, py) {
  const free = S.pieces.filter((p) => !p.locked).sort((a, b) => b.z - a.z);
  for (const pc of free) {
    const w = pc.el.offsetWidth, h = pc.el.offsetHeight;
    const dx = px - (pc.cx + w / 2), dy = py - (pc.cy + h / 2);
    const th = rotOf(pc) * Math.PI / 2, c = Math.cos(th), s = Math.sin(th);
    const lx = dx * c + dy * s + w / 2, ly = -dx * s + dy * c + h / 2;
    if (lx < 0 || ly < 0 || lx > w || ly > h) continue;
    if (scratch.isPointInPath(pc.path, lx, ly)) return pc;
  }
  return null;
}
el.field.addEventListener('pointerdown', (e) => {
  if (!S || S.done || !el.intro.hidden) return;
  const r = el.field.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const pc = hit(px, py);
  if (!pc) return;
  e.preventDefault();
  drag = { pc, dx: px - pc.cx, dy: py - pc.cy, id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false };
  try { el.field.setPointerCapture(e.pointerId); } catch (err) { /* 失敗しても操作は継続 */ }
  pc.z = ++zTop;
  pc.el.style.zIndex = pc.z;
  pc.el.classList.add('lift');
  el.hint.style.display = 'none';
  startTimer();
});
el.field.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 7) return;
    drag.moved = true;
  }
  const r = el.field.getBoundingClientRect();
  const { pc } = drag, { m, pw, ph, bw } = M;
  const fh = el.field.clientHeight;
  pc.cx = Math.min(Math.max(e.clientX - r.left - drag.dx, -m), bw - pw - m);
  pc.cy = Math.min(Math.max(e.clientY - r.top - drag.dy, -m), fh - ph - m);
  pc.el.style.left = pc.cx + 'px';
  pc.el.style.top = pc.cy + 'px';
});
function drop(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { pc } = drag;
  const tapped = !drag.moved;
  drag = null;
  const { m, pw, ph, bw } = M;
  pc.fx = (pc.cx + m) / bw;
  pc.fy = (pc.cy + m) / bw;
  pc.el.classList.remove('lift');
  if (tapped && S.level.rotate) {
    pc.turn += 1;
    pc.el.style.transform = `rotate(${pc.turn * 90}deg)`;
  }
  const tx = pc.x * pw - m, ty = pc.y * ph - m;
  const snapDist = Math.max(14, 0.3 * Math.min(pw, ph));
  if (rotOf(pc) === 0 && Math.hypot(pc.cx - tx, pc.cy - ty) < snapDist) lock(pc);
}
el.field.addEventListener('pointerup', drop);
el.field.addEventListener('pointercancel', drop);

/* ---------- ボタン類 ---------- */
function showIntro() {
  if (S && S.started && !S.done) pauseTimer();
  buildLevels();
  el.resume.hidden = !(S && S.started && !S.done);
  el.intro.hidden = false;
}
function hideIntro() { el.intro.hidden = true; }
function buildLevels() {
  el.lvlList.textContent = '';
  for (const lv of LEVELS) {
    const { cols, rows } = lv;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lvl';
    const best = getBest(lv);
    b.innerHTML = '<b></b><span></span><small></small><em></em>';
    b.children[0].textContent = lv.label;
    b.children[1].textContent = `${cols * rows}ピース`;
    b.children[2].textContent = `回転${lv.rotate ? 'あり' : 'なし'}・下絵${lv.guide ? 'あり' : 'なし'}`;
    b.children[3].textContent = best !== null ? `ベスト ${fmt(best)}` : '';
    b.addEventListener('click', () => { hideIntro(); newGame(lv); });
    el.lvlList.appendChild(b);
  }
}
$('#btnResume').addEventListener('click', () => { hideIntro(); if (S && S.started && !S.done) startTimer(); });
$('#btnLevel').addEventListener('click', showIntro);
$('#btnLevel2').addEventListener('click', showIntro);
$('#btnRestart').addEventListener('click', () => { if (S) newGame(S.level); });
$('#btnAgain').addEventListener('click', () => { if (S) newGame(S.level); window.scrollTo({ top: 0 }); });
el.btnPreview.addEventListener('click', () => {
  const on = el.preview.classList.toggle('show');
  el.btnPreview.setAttribute('aria-pressed', String(on));
  clearTimeout(previewTimer);
  if (on) previewTimer = setTimeout(() => { el.preview.classList.remove('show'); el.btnPreview.setAttribute('aria-pressed', 'false'); }, 3000);
});
$('#btnShare').addEventListener('click', async () => {
  if (!S) return;
  const text = `「まちかどジグソー」で「${stage.title}」を${S.n}ピース・${fmt(S.finalSec)}で完成させたよ！`;
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  try { await navigator.clipboard.writeText(text); toast('結果をコピーしました'); }
  catch (err) { toast(text); }
});

let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(relayout, 120); });

/* ---------- 起動 ---------- */
img.onload = () => {
  aspect = img.naturalWidth / img.naturalHeight;
  for (const id of ['ghost', 'finalImg', 'previewImg']) $('#' + id).src = stage.src;
  calcMetrics(LEVELS[1].cols, LEVELS[1].rows);
  applySizes();
  buildLevels();
};
img.src = stage.src;
})();
</script>
</body>
