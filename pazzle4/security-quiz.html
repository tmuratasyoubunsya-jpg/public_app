<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぷらねっと君の情報セキュリティ○×クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #dce8fb;
  --bg2: #c3d5f4;
  --panel: #ffffff;
  --panel2: #eef3fd;
  --line: #aebfe3;
  --text: #16204a;
  --muted: #55639a;
  --accent: #f2a900;
  --accent-ink: #2a1d00;
  --ok: #138a7c;
  --okbg: #dff3ef;
  --bad: #d6454b;
  --badbg: #fbe3e4;
  --shadow: rgba(22, 32, 74, .3);
  --star: rgba(255, 255, 255, 0);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1737;
    --bg2: #080d22;
    --panel: #1b2650;
    --panel2: #141d42;
    --line: #34416f;
    --text: #eef1fb;
    --muted: #a3aed6;
    --accent: #ffd35a;
    --accent-ink: #2a1d00;
    --ok: #62d6c6;
    --okbg: #143a3d;
    --bad: #ff7a80;
    --badbg: #4a2236;
    --shadow: rgba(0, 0, 0, .55);
    --star: rgba(255, 255, 255, .75);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1737;
  --bg2: #080d22;
  --panel: #1b2650;
  --panel2: #141d42;
  --line: #34416f;
  --text: #eef1fb;
  --muted: #a3aed6;
  --accent: #ffd35a;
  --accent-ink: #2a1d00;
  --ok: #62d6c6;
  --okbg: #143a3d;
  --bad: #ff7a80;
  --badbg: #4a2236;
  --shadow: rgba(0, 0, 0, .55);
  --star: rgba(255, 255, 255, .75);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100%;
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  font-weight: 500;
  color: var(--text);
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.6px 1.6px at 8% 14%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 22% 66%, var(--star), transparent),
    radial-gradient(1.8px 1.8px at 35% 28%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 51% 82%, var(--star), transparent),
    radial-gradient(1.6px 1.6px at 63% 12%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 77% 58%, var(--star), transparent),
    radial-gradient(1.8px 1.8px at 90% 30%, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 94% 88%, var(--star), transparent);
}
button { font: inherit; color: inherit; touch-action: manipulation; }
.app { position: relative; max-width: 640px; margin: 0 auto; padding: 12px 14px 32px; }
.mascot { flex: none; display: block; }
.mascot.sm { width: 44px; height: 44px; }
.mascot.md { width: 68px; height: 68px; }
.mascot.xl { width: 108px; height: 108px; }
.mc-ring { fill: none; stroke: var(--ok); stroke-width: 7; stroke-linecap: round; }
.mc-body { fill: var(--accent); }
.mc-eye { fill: #2a1d00; }
.mc-mouth { fill: none; stroke: #2a1d00; stroke-width: 3.2; stroke-linecap: round; }
.mc-cheek { fill: #ff8f8f; opacity: .65; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: clamp(1.05rem, 3.6vw, 1.4rem); font-weight: 900; line-height: 1.25; }
.hud { display: flex; gap: 14px; flex: none; }
.stat { text-align: right; line-height: 1.2; }
.stat .k { display: block; font-size: .7rem; color: var(--muted); }
.stat .v { font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; margin-bottom: 14px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }

.say { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.bubble {
  position: relative; flex: 1;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 10px 14px; line-height: 1.6; min-height: 3.2em; display: flex; align-items: center;
}
.bubble::before {
  content: ""; position: absolute; left: -8px; top: 24px; width: 14px; height: 14px;
  background: var(--panel); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
  transform: rotate(45deg);
}

.qcard {
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  padding: 20px 20px 22px; box-shadow: 0 10px 30px var(--shadow);
}
.qnum { margin: 0 0 8px; font-size: .85rem; font-weight: 700; color: var(--muted); }
.qtext { margin: 0; font-size: clamp(1.1rem, 4.2vw, 1.35rem); font-weight: 700; line-height: 1.85; min-height: 5.6em; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.ans {
  display: flex; align-items: center; justify-content: center; min-height: 96px;
  border-radius: 20px; border: 3px solid var(--line); background: var(--panel2); cursor: pointer;
  transition: transform .12s, background .2s, border-color .2s;
}
.ans svg { width: 54px; height: 54px; }
.ans.maru { color: var(--ok); }
.ans.batsu { color: var(--bad); }
.ans.maru:hover:not([disabled]) { border-color: var(--ok); }
.ans.batsu:hover:not([disabled]) { border-color: var(--bad); }
.ans[disabled] { cursor: default; }
.ans.right { border-color: var(--ok); background: var(--okbg); transform: scale(1.02); }
.ans.wrong { border-color: var(--bad); background: var(--badbg); animation: shake .4s; }
.ans.dim { opacity: .4; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.btn:focus-visible, .ans:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.fb { margin-top: 16px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); }
.fb[hidden] { display: none; }
.fb.ok { border-color: var(--ok); background: var(--okbg); }
.fb.ng { border-color: var(--bad); background: var(--badbg); }
.fb h2 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 900; }
.fb .ansline { margin: 0 0 6px; font-weight: 700; }
.fb p.exp { margin: 0 0 12px; line-height: 1.8; }

.btn {
  font-weight: 700; font-size: .95rem; background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: .55em 1.3em; min-height: 46px; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.overlay {
  position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center;
  padding: 14px; background: color-mix(in srgb, var(--bg2) 82%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto;
}
.overlay[hidden] { display: none; }
.sheet {
  width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 22px; padding: 20px 20px 18px; box-shadow: 0 14px 40px var(--shadow);
}
.sheet h2 { margin: 0; font-size: 1.4rem; font-weight: 900; line-height: 1.3; }
.sheet .head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.sheet p { margin: 0 0 12px; line-height: 1.8; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.rules { margin: 0 0 4px; padding-left: 1.2em; line-height: 1.8; color: var(--muted); font-size: .9rem; }
.score { font-size: 3rem; font-weight: 900; line-height: 1; margin: 4px 0; }
.score small { font-size: 1.1rem; color: var(--muted); font-weight: 700; }
.rank { display: inline-block; padding: 2px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 900; }
.meta { color: var(--muted); font-size: .9rem; }
details { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
details summary { cursor: pointer; font-weight: 700; }
.review { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.review li { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); line-height: 1.7; font-size: .92rem; }
.review li b { color: var(--bad); }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px); max-width: 90vw;
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 9500;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
@media (max-width: 480px) { .qcard { padding: 16px 16px 18px; } }
@media (prefers-reduced-motion: reduce) { .bar i, .ans, .toast { transition: none; } .ans.wrong { animation: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- ぷらねっと君（仮イラスト）。本物のマスコット画像に差し替えてください -->
    <symbol id="mascot" viewBox="0 0 120 120">
      <ellipse class="mc-ring" cx="60" cy="66" rx="52" ry="15" transform="rotate(-16 60 66)"/>
      <circle class="mc-body" cx="60" cy="60" r="35"/>
      <circle class="mc-eye" cx="48" cy="56" r="4.6"/>
      <circle class="mc-eye" cx="72" cy="56" r="4.6"/>
      <ellipse class="mc-cheek" cx="41" cy="68" rx="6" ry="4"/>
      <ellipse class="mc-cheek" cx="79" cy="68" rx="6" ry="4"/>
      <path class="mc-mouth" d="M52 68 Q60 77 68 68"/>
      <path class="mc-ring" d="M9 66 A52 15 0 0 0 111 66" transform="rotate(-16 60 66)"/>
    </symbol>
  </defs>
</svg>

<main class="app">
  <header class="top">
    <div class="brand">
      <svg class="mascot sm" aria-hidden="true"><use href="#mascot"/></svg>
      <h1>情報セキュリティ<br>○×クイズ</h1>
    </div>
    <div class="hud">
      <div class="stat"><span class="k">せいかい</span><span class="v" id="score">0</span></div>
      <div class="stat"><span class="k">れんぞく</span><span class="v" id="streak">0</span></div>
    </div>
  </header>

  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

  <div class="say">
    <svg class="mascot md" aria-hidden="true"><use href="#mascot"/></svg>
    <div class="bubble" id="say" aria-live="polite"></div>
  </div>

  <section class="qcard" aria-live="polite">
    <p class="qnum" id="qnum"></p>
    <p class="qtext" id="qtext"></p>
    <div class="answers">
      <button class="ans maru" id="btnYes" type="button" aria-label="○（正しい）">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="6"/></svg>
      </button>
      <button class="ans batsu" id="btnNo" type="button" aria-label="×（まちがい）">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 10 L38 38 M38 10 L10 38" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="fb" id="fb" hidden>
      <h2 id="fbHead"></h2>
      <p class="ansline" id="fbAns"></p>
      <p class="exp" id="fbExp"></p>
      <button class="btn primary" id="btnNext" type="button">次の問題へ</button>
    </div>
  </section>
</main>

<div class="overlay" id="intro">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="head">
      <svg class="mascot xl" aria-hidden="true"><use href="#mascot"/></svg>
      <h2 id="introTitle">ぷらねっと君の<br>情報セキュリティ○×クイズ</h2>
    </div>
    <p>仕事でも暮らしでも役立つ、情報セキュリティの「ほんとう？ うそ？」に挑戦しよう！</p>
    <ul class="rules">
      <li>全部で10問。文章が正しければ○、まちがっていれば×を選ぼう。</li>
      <li>答えたあとに、ぷらねっと君が短い解説をしてくれるよ。</li>
      <li>遊ぶたびに、出る問題と順番がかわるよ。</li>
    </ul>
    <div class="row"><button class="btn primary" id="btnStart" type="button">クイズをはじめる</button></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="endTitle" id="endSheet"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* 問題集：a = true が「○（正しい）」。解説は短く、行動に結びつく形で */
const POOL = [
  { a: false, q: '覚えやすいように、複数のサービスで同じパスワードを使い回すのが安全だ。',
    e: '1つのサービスからパスワードが漏れると、同じパスワードで他のサービスにも不正ログインされるおそれがあります。サービスごとに変えましょう。' },
  { a: false, q: '知らない送信元からのメールの添付ファイルは、念のため開いて中身を確かめたほうがよい。',
    e: '添付ファイルやリンクにウイルスが仕込まれていることがあります。開かずに、社内の担当者へ報告しましょう。' },
  { a: true, q: '公共の無料Wi-Fiでは、通信の内容をのぞき見される危険がある。',
    e: '暗号化されていないWi-Fiでは、通信を盗み見られるおそれがあります。重要な情報のやり取りは避けましょう。' },
  { a: true, q: 'パソコンやスマホのアップデートには、セキュリティ上の弱点をふさぐ意味もある。',
    e: '更新には、見つかった弱点（脆弱性）の修正が含まれています。後回しにせず、早めに適用しましょう。' },
  { a: true, q: '多要素認証（パスワードに加えて、もう1つ確認を行う方法）を使うと、パスワードが漏れても不正ログインされにくくなる。',
    e: 'パスワードだけでなく、スマホへの確認コードなどを組み合わせることで、不正ログインを防ぎやすくなります。' },
  { a: true, q: '会社のパソコンから短い時間でも離れるときは、画面をロックするのが基本だ。',
    e: '席を離れたすきに、のぞき見や勝手な操作をされるのを防げます。' },
  { a: true, q: 'フィッシングとは、本物そっくりのメールやサイトで、IDやパスワードなどを入力させようとする手口だ。',
    e: 'メール内のリンクからログインせず、ブックマークや公式アプリから開くようにすると安全です。' },
  { a: false, q: '道で拾ったUSBメモリを、持ち主を調べるために会社のパソコンへ挿してもよい。',
    e: 'ウイルスが仕込まれている可能性があります。挿さずに、担当者へ渡しましょう。' },
  { a: true, q: 'パスワードは、文字数が長くて推測されにくいものほど安全だ。',
    e: '長いほど破られにくくなります。短い単語や誕生日など、推測されやすいものは避けましょう。' },
  { a: false, q: 'ウイルス対策ソフトを入れていれば、どんな攻撃も防げるので、ほかの対策はいらない。',
    e: 'ソフトは大切ですが万能ではありません。更新・認証・日ごろの注意など、対策を組み合わせます。' },
  { a: true, q: '会社の業務データを、許可なく個人のクラウドストレージへ移して持ち帰るのは避けるべきだ。',
    e: '会社の管理の外に情報が出てしまい、漏えいの原因になります。ルールに従い、許可された方法で扱いましょう。' },
  { a: false, q: 'メールを宛先まちがいで送ってしまったら、黙って様子を見るのがよい。',
    e: 'すぐに上長や担当部署へ報告しましょう。早く動くほど、被害の広がりを抑えられます。' },
  { a: false, q: 'パスワードを付箋に書いて、パソコンのモニターに貼っておくのは安全な管理方法だ。',
    e: '誰でも見られる場所に貼ると、簡単に盗み見られます。パスワード管理ツールなど、安全な方法を使いましょう。' },
  { a: true, q: 'SNSに社内の様子や書類の写真をのせるときは、画面や書類などの写り込みに注意が必要だ。',
    e: '背景のモニター、書類、ホワイトボードなどから、情報が漏れることがあります。投稿前に確認しましょう。' },
  { a: true, q: '情報セキュリティの3要素は、「機密性・完全性・可用性」である。',
    e: '機密性は許可された人だけが見られること、完全性は正確で改ざんされていないこと、可用性は必要なときに使えることです。' },
  { a: false, q: '届いたメールの送信元が知っている会社名に見えれば、必ず本物のメールだと判断してよい。',
    e: '表示名やアドレスは偽装できます。内容が不自然なときは、リンクを開かず、別の方法で相手に確認しましょう。' },
  { a: false, q: '重要な書類は、いらなくなったら、そのまま普通のゴミ箱に捨ててよい。',
    e: 'シュレッダーや溶解処理など、読み取れない形で廃棄しましょう。' },
  { a: true, q: 'ショートメッセージ（SMS）のリンクからも、フィッシング被害にあうことがある。',
    e: '宅配便の不在通知などをよそおった偽SMSが多くあります。リンクは開かず、公式アプリや公式サイトで確認しましょう。' },
  { a: false, q: 'データのバックアップは、元のデータと同じ場所だけに保存しておけば十分だ。',
    e: '故障や災害、ランサムウェアで元データと一緒に失うおそれがあります。別の場所や別の媒体にも保存しましょう。' },
  { a: true, q: '来訪者を社内へ案内するときは、受付で記録をとり、名札をつけてもらい、1人きりにしないようにする。',
    e: '来訪者の出入りを把握し、見られてはいけない情報や場所に近づけないようにするための基本です。' },
  { a: false, q: 'パソコンやスマホをなくしたときは、自分で探し終えるまで、会社への連絡は待ってよい。',
    e: '速やかに報告しましょう。遠隔でロックしたり、データを消したりする対応を、早く始められます。' },
  { a: true, q: 'ランサムウェアとは、データを暗号化して使えなくし、元に戻す代わりにお金を要求するウイルスだ。',
    e: '被害を減らすには、日ごろのバックアップと、不審な添付ファイルやリンクを開かないことが大切です。' },
  { a: true, q: 'ファイルを共有するときは、必要な人にだけ、必要な権限で見られるように設定するのが基本だ。',
    e: '「全員が見られる」設定のままにすると、見せるつもりのない人にも情報が届いてしまいます。' },
  { a: false, q: '個人情報を含むファイルにパスワードをかけてメールで送るとき、そのパスワードを同じメールに書いておけば安全だ。',
    e: '同じメールに書くと、メールを盗み見た人がファイルとパスワードの両方を手に入れられます。別の方法で伝えるか、より安全な共有方法を選びましょう。' }
];
const ROUND = 10;

const $ = (s) => document.querySelector(s);
const el = {
  score: $('#score'), streak: $('#streak'), bar: $('#barFill'), say: $('#say'),
  qnum: $('#qnum'), qtext: $('#qtext'), yes: $('#btnYes'), no: $('#btnNo'),
  fb: $('#fb'), fbHead: $('#fbHead'), fbAns: $('#fbAns'), fbExp: $('#fbExp'), next: $('#btnNext'),
  intro: $('#intro'), end: $('#end'), endSheet: $('#endSheet'), toast: $('#toast')
};
let R = null;
let toastTimer = null;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
}
function getBest() { try { const v = localStorage.getItem('sec-quiz-best'); return v === null ? null : Number(v); } catch (e) { return null; } }
function setBest(n) { try { localStorage.setItem('sec-quiz-best', String(n)); } catch (e) { /* 保存できなくても続行 */ } }

function newRound() {
  const yes = shuffle(POOL.filter((q) => q.a)).slice(0, ROUND / 2);
  const no = shuffle(POOL.filter((q) => !q.a)).slice(0, ROUND / 2);
  R = { qs: shuffle([...yes, ...no]), i: 0, score: 0, streak: 0, bestStreak: 0, answered: false, missed: [] };
}
function renderHud() {
  el.score.textContent = R.score;
  el.streak.textContent = R.streak;
  el.bar.style.width = `${(R.i / ROUND) * 100}%`;
}
function showQuestion() {
  const q = R.qs[R.i];
  R.answered = false;
  el.qnum.textContent = `第${R.i + 1}問 ／ ${ROUND}問`;
  el.qtext.textContent = q.q;
  for (const b of [el.yes, el.no]) { b.disabled = false; b.className = 'ans ' + (b === el.yes ? 'maru' : 'batsu'); }
  el.fb.hidden = true;
  el.say.textContent = R.i === 0 ? 'この文章は、正しいかな？ ○か×で答えてね！' : pick(['つぎの問題だよ。じっくり読んでね。', 'これは○？ ×？', 'さあ、どっちだろう？']);
  renderHud();
}
function answer(choice) {
  if (!R || R.answered) return;
  R.answered = true;
  const q = R.qs[R.i];
  const ok = choice === q.a;
  if (ok) { R.score++; R.streak++; R.bestStreak = Math.max(R.bestStreak, R.streak); }
  else { R.streak = 0; R.missed.push(q); }
  for (const b of [el.yes, el.no]) b.disabled = true;
  const chosen = choice ? el.yes : el.no, correct = q.a ? el.yes : el.no;
  correct.classList.add('right');
  if (!ok) { chosen.classList.add('wrong'); } else { (q.a ? el.no : el.yes).classList.add('dim'); }
  el.fb.className = 'fb ' + (ok ? 'ok' : 'ng');
  el.fbHead.textContent = ok ? 'せいかい！' : 'ざんねん…';
  el.fbAns.textContent = `答えは ${q.a ? '○（正しい）' : '×（まちがい）'}`;
  el.fbExp.textContent = q.e;
  el.next.textContent = R.i === ROUND - 1 ? '結果を見る' : '次の問題へ';
  el.fb.hidden = false;
  el.say.textContent = ok
    ? pick(['その調子！', 'さすが！ よく知ってるね。', 'せいかい！ 次もいこう！'])
    : pick(['おしい！ 解説を読んでおこう。', 'ここは落とし穴だったね…', 'だいじょうぶ、覚えておけばOK！']);
  renderHud();
  el.next.focus({ preventScroll: true });
}
function next() {
  if (!R || !R.answered) return;
  R.i++;
  if (R.i >= ROUND) { finish(); return; }
  showQuestion();
}
function finish() {
  R.i = ROUND; renderHud();
  const s = R.score;
  const prevBest = getBest();
  const isBest = prevBest === null || s > prevBest;
  if (isBest) setBest(s);
  const rank = s === 10 ? 'セキュリティマスター' : s >= 8 ? 'セキュリティのしっかり者' : s >= 6 ? 'あと一歩の見習い' : 'これから伸びる新人';
  const comment = s === 10 ? '全問せいかい！ 完ぺきだよ。みんなにも教えてあげてね。'
    : s >= 8 ? 'すばらしい！ まちがえた問題の解説だけ、見ておこう。'
    : s >= 6 ? 'いい感じ！ 解説を読んで、もう一回チャレンジしてみよう。'
    : '大丈夫、ここから覚えればOK。解説を読んで、もう一度やってみよう！';
  const review = R.missed.length
    ? `<details><summary>まちがえた問題を見る（${R.missed.length}問）</summary><ul class="review">${R.missed.map((m) => `<li><b>${m.a ? '○' : '×'}</b>　${m.q}<br>${m.e}</li>`).join('')}</ul></details>`
    : '';
  el.endSheet.innerHTML = `
    <div class="head"><svg class="mascot xl" aria-hidden="true"><use href="#mascot"/></svg><h2 id="endTitle">結果発表！</h2></div>
    <div class="score">${s}<small> ／ ${ROUND}問</small></div>
    <p><span class="rank"></span></p>
    <p class="comment"></p>
    <p class="meta">れんぞくせいかい 最高${R.bestStreak}${isBest && prevBest !== null ? '　ベスト更新！' : ''}${!isBest ? `　ベスト ${prevBest}／${ROUND}` : ''}</p>
    ${review}
    <div class="row"><button class="btn primary" id="eShare" type="button">結果をシェア</button><button class="btn" id="eAgain" type="button">もう一度あそぶ</button></div>`;
  el.endSheet.querySelector('.rank').textContent = rank;
  el.endSheet.querySelector('.comment').textContent = comment;
  el.endSheet.querySelector('#eShare').addEventListener('click', () => share(s, rank));
  el.endSheet.querySelector('#eAgain').addEventListener('click', start);
  el.end.hidden = false;
}
async function share(s, rank) {
  const text = `「情報セキュリティ○×クイズ」で${s}／${ROUND}問せいかい！ 称号は「${rank}」でした。`;
  try { if (navigator.share) { await navigator.share({ text }); return; } }
  catch (err) { if (err && err.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('結果をコピーしました'); }
  catch (err) { toast(text); }
}
function start() {
  newRound();
  el.intro.hidden = true;
  el.end.hidden = true;
  showQuestion();
}

el.yes.addEventListener('click', () => answer(true));
el.no.addEventListener('click', () => answer(false));
el.next.addEventListener('click', next);
$('#btnStart').addEventListener('click', start);
document.addEventListener('keydown', (e) => {
  if (!R || !el.intro.hidden || !el.end.hidden || e.isComposing) return;
  const k = e.key.toLowerCase();
  if (!R.answered) {
    if (k === 'o' || k === 'arrowleft') answer(true);
    else if (k === 'x' || k === 'arrowright') answer(false);
  }
});

newRound();
showQuestion();
})();
</script>
</body>
</html>
